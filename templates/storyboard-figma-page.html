<!doctype html>
<html lang="ko">
<!-- One Figma-extracted screen = one page, filled by scripts/figma_storyboard.py
     via Python str.format. LEFT = screen image + crisp HTML callouts; RIGHT = real
     description text; BOTTOM = real policy text. NOTE: do NOT put format-placeholder
     tokens in comments here — they would be substituted with real markup. Literal CSS
     braces in the style block are doubled so str.format leaves them intact. -->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{code} · {title} · 화면설계서</title>
  <link rel="stylesheet" href="./storyboard.css" />
  <style>
    .sb-nav {{ flex-wrap: wrap; row-gap: 8px; }}
    .sb-nav .sb-right {{ margin-left: auto; display: flex; align-items: center; gap: 14px; }}
    .sb-pager {{ display: flex; gap: 8px; }}
    .sb-pager a, .sb-pager span.pg {{ font-size: 12px; font-weight: 700; color: #cfe0f2; text-decoration: none; padding: 5px 10px; border-radius: 7px; background: rgba(255,255,255,.08); }}
    .sb-pager a:hover {{ background: rgba(255,255,255,.18); color: #fff; }}
  </style>
</head>
<body class="sb-body">
  <nav class="sb-nav">
    <a class="sb-back" href="./index.html">← 보드</a>
    <span class="sb-nav-code">{code}</span>
    <span class="sb-nav-title">{title}</span>
    <span class="sb-right">{ctl}
      <span class="sb-pager">{prev}<span class="pg" style="opacity:.6">{seq}/{N}</span>{next}</span>
    </span>
  </nav>
  <div class="sb-layout">
    <aside class="sb-toc" aria-label="화면 목차">{toc}</aside>
    <main class="sb-main">
      <header class="sb-head">
        <p class="sb-eyebrow">{page_label}</p>
        <h1>{title}</h1>
        <dl class="sb-meta">
          <div><dt>화면 ID</dt><dd>{code}</dd></div>
          <div><dt>페이지</dt><dd>{page_label}</dd></div>
          <div><dt>유형</dt><dd>{state}</dd></div>
          <div><dt>Figma 원본</dt><dd><a href="{deeplink}" target="_blank" rel="noopener">프레임 열기 ↗</a></dd></div>
        </dl>
      </header>
      {body}
      <p class="sb-foot">{seq} / {N} · 출처 Figma · {file_name} · node {fid} · <a href="./index.html">보드</a></p>
    </main>
  </div>
  {lightbox}
  {settings_js}
</body>
</html>
